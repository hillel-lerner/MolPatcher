[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molpatcher"
version = "0.1.0"
authors = [
  { name="Hillel Lerner" }
]
description = "A computational chemistry tool for automated geometric alignment and topological merging of molecular patches."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "networkx>=2.6"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry"
]

[project.scripts]
molpatcher = "mol_patcher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mol_patcher = ["configs/*.json"]
